<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Company Logos Slider</title>
  <style>
    body {
      background-color: #000;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    @keyframes slide {
      from {
        transform: translateX(0%);
      }
      to {
        transform: translateX(-100%);
      }
    }

    @keyframes slide-reverse {
      from {
        transform: translateX(-100%);
      }
      to {
        transform: translateX(0%);
      }
    }

    .company-logos {
      width: 100%;
    }

    .logos {
      overflow: hidden;
      padding: 15px 0;
      background: #f5f5f5; /* ✅ Light gray background for visibility */
      white-space: nowrap;
      position: relative;
    }

    .logos::before,
    .logos::after {
      position: absolute;
      top: 0;
      width: 80px;
      height: 100%;
      content: "";
      z-index: 2;
      pointer-events: none;
    }

    .logos::before {
      left: 0;
      background: linear-gradient(to left, rgba(245, 245, 245, 0), #f5f5f5);
    }

    .logos::after {
      right: 0;
      background: linear-gradient(to right, rgba(245, 245, 245, 0), #f5f5f5);
    }

    .logos-slide,
    .logos-slide-reverse {
      display: inline-block;
      animation: 35s linear infinite;
    }

    .logos-slide {
      animation-name: slide;
    }

    .logos-slide-reverse {
      animation-name: slide-reverse;
    }

    .logos-slide img,
    .logos-slide-reverse img {
      height: 3vw;
      max-height: 50px;
      margin: 0 4vw;
      vertical-align: middle;
      filter: grayscale(100%);
    }

    /* Responsive styles */
    @media (max-width: 768px) {
      .logos-slide img,
      .logos-slide-reverse img {
        height: 10vw;
        margin: 0 4vw;
      }
    }

    @media (max-width: 480px) {
      .logos-slide img,
      .logos-slide-reverse img {
        height: 12vw;
        margin: 0 3vw;
      }

      .logos::before,
      .logos::after {
        width: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="company-logos">
    <!-- First row -->
    <div class="logos">
      <div class="logos-slide">
        <img src="img/Company logo 1.png" alt="Logo 1" />
        <img src="img/Company logo 2.png" alt="Logo 2" />
        <img src="img/Company logo 3.png" alt="Logo 3" />
        <img src="img/Company logo 4.png" alt="Logo 4" />
      </div>
      <div class="logos-slide">
        <img src="img/Company logo 1.png" alt="Logo 1" />
        <img src="img/Company logo 2.png" alt="Logo 2" />
        <img src="img/Company logo 3.png" alt="Logo 3" />
        <img src="img/Company logo 4.png" alt="Logo 4" />
      </div>
    </div>

    <!-- Second row -->
    <div class="logos">
      <div class="logos-slide-reverse">
        <img src="img/Company logo 5.png" alt="Logo 5" />
        <img src="img/Company logo 6.png" alt="Logo 6" />
        <img src="img/Company logo 7.png" alt="Logo 7" />
        <img src="img/Company logo 8.png" alt="Logo 8" />
      </div>
      <div class="logos-slide-reverse">
        <img src="img/Company logo 5.png" alt="Logo 5" />
        <img src="img/Company logo 6.png" alt="Logo 6" />
        <img src="img/Company logo 7.png" alt="Logo 7" />
        <img src="img/Company logo 8.png" alt="Logo 8" />
      </div>
    </div>
  </div>
</body>
</html>
