<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Testimonial Section</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .section-9 {
      background-color: #d1d1d17c;
      padding: 60px 20px;
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      flex-wrap: wrap;
      gap: 30px;
    }

    .testimonial-header {
      display: flex;
      flex-direction: column;
      max-width: 600px;
      flex: 1 1 200px;
    }

    .testimonial-header p {
      color: #1CBBB6;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .testimonial-header h1 {
      font-weight: 600;
      font-size: 3rem;
      line-height: 1.2;
      margin-bottom: 15px;
    }

    .testimonial-header h1 .Success {
      color: #1CBBB6;
    }

    .testimonial-header h3 {
      color: #7B7B7B;
      font-weight: 500;
      font-size: 1rem;
    }

    .testimonial-slider {
      background: #000;
      width: 100%;
      max-width: 500px;
      height: 350px;
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      flex: 1 1 300px;
    }

    @media (max-width: 768px) {
      .section-9 {
        flex-direction: column;
        text-align: center;
      }

      .testimonial-header h1 {
        font-size: 2.2rem;
      }

      .testimonial-header h3 {
        font-size: 0.95rem;
      }

      .testimonial-slider {
        height: 300px;
      }
    }

    @media (max-width: 480px) {
      .testimonial-header h1 {
        font-size: 1.8rem;
      }

      .testimonial-header h3 {
        font-size: 0.85rem;
      }

      .testimonial-slider {
        height: 250px;
      }
    }
  </style>
</head>
<body>
  <div class="section-9">
    <div class="testimonial-header">
      <p>------ Client Testimonial ------</p>
      <h1>
        Excellence in Every <br>
        Where <span class="Success">Ideas</span>
      </h1>
      <h3>
        A creative agency speciali providing innovative and unique <br>
        solutions to businesses build
      </h3>
    </div>
    <div class="testimonial-slider">
      <!-- Your slider content goes here -->
    </div>
  </div>
</body>
</html>
