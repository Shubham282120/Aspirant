<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Plane Preloader</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: #fff;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    .preloader-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      z-index: 9999;
      opacity: 1;
      transition: opacity 1s ease;
    }

    .preloader-container.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .fly-wrapper {
      position: absolute;
      left: 50%;
      top: 80%;
      transform: translateX(-50%);
      animation: flyTakeoff 4.5s ease-in-out forwards;
      width: 140px;
      height: 160px;
      text-align: center;
    }

    .plane {
      width: 80px;
      position: relative;
      z-index: 3;
      animation: planeSway 1.2s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.2));
    }

    .plane-name {
      margin-top: 8px;
      font-size: 18px;
      font-weight: 600;
      color: #1CBBB6;
      letter-spacing: 1px;
      animation: nameFade 4.5s ease-in-out forwards;
    }

    .glow-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 149, 255, 0.2) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      animation: glowPulse 2.5s infinite;
      z-index: 1;
    }

    .shadow {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 10px;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 50%;
      animation: shadowScale 4.5s ease-in-out forwards;
      z-index: 0;
    }

    .wind-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .wind-line {
      position: absolute;
      width: 100px;
      height: 2px;
      background: linear-gradient(90deg, #00aaff, transparent);
      opacity: 0.2;
      animation: windMove 2s linear infinite;
    }

    .wind-line:nth-child(1) { top: 20%; left: -120px; animation-delay: 0s; }
    .wind-line:nth-child(2) { top: 40%; left: -180px; animation-delay: 0.5s; }
    .wind-line:nth-child(3) { top: 60%; left: -150px; animation-delay: 1s; }
    .wind-line:nth-child(4) { top: 80%; left: -200px; animation-delay: 1.5s; }

    /* ==== Animations ==== */
    @keyframes flyTakeoff {
      0%   { top: 80%; transform: translateX(-50%) scale(1); opacity: 1; }
      40%  { top: 50%; transform: translateX(-50%) scale(1.05); }
      70%  { top: 20%; transform: translateX(-50%) rotate(-5deg); }
      85%  { top: 18%; transform: translateX(-50%) rotate(-10deg); opacity: 1; }
      100% { top: -20%; transform: translateX(-50%) rotate(-25deg); opacity: 0; }
    }

    @keyframes planeSway {
      0%   { transform: rotate(-3deg); }
      100% { transform: rotate(3deg); }
    }

    @keyframes glowPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.3; }
      50%      { transform: translate(-50%, -50%) scale(1.05); opacity: 0.6; }
    }

    @keyframes shadowScale {
      0%   { transform: translateX(-50%) scale(1); opacity: 0.15; }
      100% { transform: translateX(-50%) scale(0.3); opacity: 0; }
    }

    @keyframes windMove {
      0%   { transform: translateX(0); }
      100% { transform: translateX(120vw); }
    }

    @keyframes nameFade {
      0%   { opacity: 1; transform: translateY(0); }
      80%  { opacity: 1; transform: translateY(-10px); }
      100% { opacity: 0; transform: translateY(-50px); }
    }

    /* ==== Main Content Styling ==== */
    .main-content {
      opacity: 0;
      transition: opacity 1s ease;
      padding: 40px;
    }

    .main-content.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Preloader -->
  <div class="preloader-container">
    <div class="wind-container">
      <div class="wind-line"></div>
      <div class="wind-line"></div>
      <div class="wind-line"></div>
      <div class="wind-line"></div>
    </div>

    <div class="fly-wrapper">
      <div class="glow-circle"></div>
      <img src="img/fav icon.png" class="plane" alt="Plane" />
      <div class="plane-name">Aspirant</div>
      <div class="shadow"></div>
    </div>
  </div>

  <!-- Main Website Content -->
  <div class="main-content">
    <h1>Welcome to Aspirant</h1>
    <p>This is your main website content that appears after the plane takes off.</p>
    <p>You can place your homepage, hero section, or anything here.</p>
  </div>

  <script>
    window.addEventListener("load", () => {
      setTimeout(() => {
        document.querySelector('.preloader-container').classList.add('fade-out');
        document.querySelector('.main-content').classList.add('visible');
        document.body.style.overflow = 'auto'; // allow scroll after load
      }, 4700); // after plane animation
    });
  </script>

</body>
</html>
