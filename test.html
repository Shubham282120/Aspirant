<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Centered Navbar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f6f6f6;
    }

    .nav-bar {
      z-index: 999;
      position: sticky;
      top: 0;
      background: transparent;
      padding: 15px;
    }

    .nav-container {
      background: #ffffff;
      border: 1px solid #D1D1D1;
      border-radius: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 25px;
      position: relative;
    }

    .logo img {
      height: 40px;
    }

    ul {
      display: flex;
      align-items: center;
      gap: 25px;
      list-style: none;
    }

    li a {
      color: black;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    li a:hover {
      color: #1CBBB6;
    }

    button {
      background-color: #1CBBB6;
      border: none;
      border-radius: 99px;
      padding: 14px 25px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    button a {
      color: white;
      text-decoration: none;
    }

    button img {
      height: 20px;
    }

    .burger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
    }

    .burger div {
      width: 25px;
      height: 3px;
      background-color: #000;
      transition: all 0.3s ease-in-out;
    }

    /* Burger animation to "X" */
    .burger.active div:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }

    .burger.active div:nth-child(2) {
      opacity: 0;
    }

    .burger.active div:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }

    /* Mobile styles */
    @media (max-width: 768px) {
      ul {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 75px;
        left: 0;
        right: 0;
        background-color: #fff;
        border-radius: 20px;
        padding: 40px 20px;
        gap: 20px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        z-index: 998;
        opacity: 0;
        transform: translateY(-20px);
        pointer-events: none;
        transition: all 0.4s ease;
      }

      ul.active {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      .burger {
        display: flex;
      }

      button {
        display: none; /* Hide GET IN TOUCH on small screens */
      }
    }
  </style>
</head>
<body>
  <nav class="nav-bar">
    <div class="nav-container">
      <div class="logo">
        <a href="#"><img src="img/Aspirant logo.png" alt="Logo" /></a>
      </div>

      <div class="burger" onclick="toggleMenu(this)">
        <div></div>
        <div></div>
        <div></div>
      </div>

      <ul id="nav-links">
        <li><a href="#">Homes</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Blog</a></li>
        <li><a href="#">Contact</a></li>
      </ul>

      <button>
        <a href="#">GET IN TOUCH <img src="img/getintouch img.png" alt=""></a>
      </button>
    </div>
  </nav>

  <script>
    function toggleMenu(burger) {
      const navLinks = document.getElementById("nav-links");
      navLinks.classList.toggle("active");
      burger.classList.toggle("active");
    }
  </script>
</body>
</html>
