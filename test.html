<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <style>
    * {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
    }

    .section-9-main {
      padding: 40px 20px;
    }

    .contact-us {
      display: flex;
      justify-content: space-evenly;
      align-items: flex-start;
      gap: 40px;
      flex-wrap: wrap;
    }

    .user-info,
    .our-info-map {
      flex: 1;
      min-width: 300px;
      max-width: 500px;
    }

    .user-info {
      background: #ffffff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 9px 11px 20px 14px rgba(0, 0, 0, 0.05);
    }

    .user-info h1 {
      margin-bottom: 25px;
      color: #333;
      font-size: 45px;
      font-weight: 350;
    }

    .user-info input,
    .user-info textarea {
      margin-bottom: 20px;
      padding: 10px;
      border: none;
      border-bottom: 2px solid #ccc;
      background-color: transparent;
      width: 100%;
      font-size: 16px;
      outline: none;
    }

    .user-info input:focus,
    .user-info textarea:focus {
      border-bottom-color: #1CBBB6;
    }

    .user-info textarea {
      resize: vertical;
      height: 100px;
    }

    .user-info button {
      padding: 12px 24px;
      background-color: #1CBBB6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .user-info button:hover {
      background-color: #0056b3;
    }

    .our-info-map h1 {
      margin-bottom: 15px;
      color: #333;
      font-size: 45px;
      font-weight: 400;
    }

    .our-info-map p {
      color: #7B7B7B;
      margin-bottom: 20px;
    }

    iframe {
      width: 100%;
      height: 300px;
      border: 0;
      border-radius: 10px;
    }

    @media (max-width: 768px) {
      .contact-us {
        flex-direction: column;
        padding: 0;
      }

      .user-info,
      .our-info-map {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>
  <section class="section-9-main">
    <div class="contact-us">
      <div class="user-info">
        <h1>Get In Touch</h1>
        <input type="text" placeholder="Your Name" />
        <input type="email" placeholder="Your Email" />
        <textarea placeholder="Your Message"></textarea>
        <button>Send Now</button>
      </div>
      <div class="our-info-map">
        <h1>Contact With Us <span class="Success">Today</span> </h1>
        <p>A creative agency specializing in providing innovative and unique solutions to help businesses grow.</p>
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3104.630515606942!2d72.86142687520976!3d19.24948438199107!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7b193f1af94dd%3A0x99c62daf18a0a1b3!2sNorthern%20Supremus%2C%20Dahisar%20East!5e1!3m2!1sen!2sin!4v1752493265842!5m2!1sen!2sin"
          allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>
  </section>

</body>

</html>
