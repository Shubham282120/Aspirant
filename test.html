<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  .slider-container {
   max-width: 1200px;
   margin: auto;
   overflow: hidden;
 }

 .slider-wrapper {
   display: flex;
   transition: transform 0.5s ease-in-out;
 }

 .slide {
   padding: 20px;
   min-width: 100%;
   display: flex;
   flex-direction: column;
   gap: 30px;
   flex-wrap: wrap;
   align-items: flex-start;
   justify-content: space-between;
 }

 .left-content {
   flex: 1;
   min-width: 280px;
   text-align: left;
   display: flex;
   justify-content: flex-start;
   align-items: flex-start;
 }

 .left-content h1 {
   font-size: 2.8rem;
   font-weight: bold;
   line-height: 1.3;
   text-align: left;
 }

 .left-content h1 span {
   color: #03bfc4;
 }

 .right-content {
   flex: 1;
   min-width: 280px;
 }

 .right-images {
   display: flex;
   gap: 20px;
   align-items: flex-end;
 }

 .image-wrapper {
   position: relative;
   flex: 1;
   border-radius: 12px;
   overflow: hidden;
 }

 .image-wrapper img {
   width: 100%;
   border-radius: 12px;
   display: block;
 }

 .top-caption {
   font-size: 1rem;
   color: #444;
   margin-bottom: 10px;
 }

 .next-btn-wrapper {
   position: absolute;
   bottom: 0;
   right: 70px;
 }

 .next-button {
   padding: 10px 24px;
   background: #eafaf9;
   border: none;
   border-radius: 25px;
   font-weight: bold;
   cursor: pointer;
   transition: all 0.3s;
 }

 .next-button:hover {
   background-color: #03bfc4;
   color: white;
 }

 /* Responsive Tweaks */
 @media (max-width: 1024px) {
   .slide {
     flex-direction: column;
     align-items: flex-start;
     text-align: left;
     gap: 20px;
   }

   .left-content {
     width: 100%;
     text-align: left !important;
     justify-content: flex-start;
     align-items: flex-start;
   }

   .left-content h1 {
     font-size: 2rem;
     text-align: left !important;
   }

   .right-images {
     flex-direction: column;
     align-items: center;
   }

   .image-wrapper:nth-child(2) img {
     display: none;
     /* Hide 2nd image */
   }

   .image-wrapper:nth-child(2) .top-caption {
     display: block;
     text-align: center;
   }

   .image-wrapper {
     width: 90%;
   }

   .next-btn-wrapper {
     position: static;
     margin-top: 10px;
     text-align: center;
   }
 }

 @media (max-width: 500px) {
   .next-button {
     padding: 8px 20px;
     font-size: 0.95rem;
   }

   .top-caption {
     font-size: 0.95rem;
   }
 }


</style>
<body>
   <div class="slider-container">
      <div class="slider-wrapper" id="sliderWrapper">

        <!-- Slide 1 -->
        <div class="slide">
          <div class="left-content">
            <h1><span>IT STRATEGY</span> & ROADMAP<br>PLANNING</h1>
          </div>

          <div class="right-content">
            <div class="right-images">
              <!-- First Image -->
              <div class="image-wrapper">
                <img src="img/slider-1.png" alt="Consultant Image" />
              </div>

              <!-- Second Image with caption -->
              <div class="image-wrapper">
                <p class="top-caption">
                  Unlock your business’s full potential with our expert IT <br> consultancy services.
                </p>
                <img src="img/slider-2.png" alt="Team Image" />
                <div class="next-btn-wrapper">
                  <button class="next-button" onclick="nextSlide()">NEXT →</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Slide 2 -->
        <div class="slide">
          <div class="left-content">
            <h1><span>DIGITAL SERVICES</span><br> THAT TRANSFORM</h1>
          </div>

          <div class="right-content">
            <div class="right-images">
              <div class="image-wrapper">
                <img src="img/slider-1.png" alt="Digital Service Image" />
              </div>

              <div class="image-wrapper">
                <p class="top-caption">
                  Scale your infrastructure, modernize IT, and unlock new revenue opportunities.
                </p>
                <img src="img/slider-2.png" alt="Digital Team Image" />
                <div class="next-btn-wrapper">
                  <button class="next-button" onclick="nextSlide()">NEXT →</button>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <script>
      let currentIndex = 0;
function nextSlide() {
  const wrapper = document.getElementById("sliderWrapper");
  const totalSlides = wrapper.children.length;
  currentIndex = (currentIndex + 1) % totalSlides;
  wrapper.style.transform = `translateX(-${currentIndex * 100}%)`;
}

    </script>

</body>
</html>
